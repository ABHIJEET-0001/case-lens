services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Hot-reload: mount source so changes reflect without rebuild
      - ./backend:/app
      # Pipeline scripts mounted so they run inside the container
      - ./scripts:/app/scripts
      # ML training and evaluation scripts
      - ./ml:/app/ml
      # Persist FAISS index and model files outside the container
      - caselens_index:/app/data/index
      - caselens_models:/app/data/models

  # ── React + Vite frontend ────────────────────────────────────────────────────
  # Enabled in Step 6 — scaffolded separately; use `--profile frontend` to start
  frontend:
    build:
      context: ./frontend
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    profiles:
      - frontend

volumes:
  postgres_data:
  caselens_index:
  caselens_models:
